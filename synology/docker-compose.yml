services:
  pronote-homework:
    image: ghcr.io/vidax/pronote-homework-exporter:latest
    pull_policy: always
    platform: linux/amd64
    container_name: pronote-homework
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-pronote.env}
    ports:
      - "855:8080"
    volumes:
      - ./data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
